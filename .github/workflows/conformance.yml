name: Material conformance

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Corpus scope
        required: true
        default: full
        type: choice
        options:
          - sampled
          - full

permissions:
  contents: read

jobs:
  material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: python3 tools/check-material-symbols.py
      - run: python3 tools/check-material-symbols.py --suite twotone-100
      - if: inputs.scope == 'full'
        run: python3 tools/check-material-symbols.py --suite outlined-all
