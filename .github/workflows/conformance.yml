name: Material conformance

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Corpus scope
        required: true
        default: full
        type: choice
        options:
          - sampled
          - full

permissions:
  contents: read

jobs:
  material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: python3 tools/check-material-symbols.py
      - run: python3 tools/check-material-symbols.py --suite twotone-100
      - if: inputs.scope == 'full'
        run: python3 tools/check-material-symbols.py --suite outlined-all
