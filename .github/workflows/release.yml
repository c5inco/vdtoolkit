name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS binaries
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo package --locked
      - name: Require tag to match Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} does not match Cargo version $version" >&2
            exit 1
          }

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: python3 tools/check-material-symbols.py
      - run: python3 tools/check-material-symbols.py --suite twotone-100
      - run: python3 tools/check-material-symbols.py --suite outlined-all

  build:
    needs: [preflight, conformance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: vdt
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: vdt
          - os: macos-15
            target: aarch64-apple-darwin
            executable: vdt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: vdt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          directory="vdtoolkit-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$directory"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$directory/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$directory/"
          tar -czf "$directory.tar.gz" "$directory"
          if command -v sha256sum >/dev/null; then
            sha256sum "$directory.tar.gz" > "$directory.tar.gz.sha256"
          else
            shasum -a 256 "$directory.tar.gz" > "$directory.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vdtoolkit-${{ matrix.target }}
          path: |
            vdtoolkit-*.tar.gz
            vdtoolkit-*.sha256

  # Signing credentials live only in the protected macos-signing environment
  # and are never present while project code is compiled.
  sign-macos:
    if: github.ref_type == 'tag' || inputs.sign
    needs: build
    runs-on: macos-15
    environment: macos-signing
    steps:
      - name: Require signing secrets
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "missing macos-signing environment secrets:$missing" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vdtoolkit-*-apple-darwin
          path: dist
      - name: Sign and notarize
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/signing"
          keychain="$work/signing.keychain-db"
          mkdir -p "$work/notarize"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$work/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$work/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          read -r -a original_keychains <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          test -n "$identity" || {
            echo "no Developer ID Application identity in MACOS_CERTIFICATE" >&2
            exit 1
          }

          archives=(dist/*/vdtoolkit-*.tar.gz)
          test "${#archives[@]}" -eq 2 || {
            echo "expected two macOS archives, found ${#archives[@]}" >&2
            exit 1
          }
          for archive in "${archives[@]}"; do
            name=$(basename "$archive" .tar.gz)
            tar -xzf "$archive" -C "$work"
            codesign --force --options runtime --timestamp \
              --keychain "$keychain" --sign "$identity" "$work/$name/vdt"
            codesign --verify --strict --verbose=2 "$work/$name/vdt"
            cp "$work/$name/vdt" "$work/notarize/$name"
          done
          # notarytool can crash when the user keychain search list is replaced.
          security list-keychains -d user -s "${original_keychains[@]}"

          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$work/api-key.p8"
          head -1 "$work/api-key.p8" | LC_ALL=C tr -d '\r' \
            | grep -qx -- '-----BEGIN PRIVATE KEY-----' || {
            echo "APPLE_API_KEY must be the base64 of the AuthKey_*.p8 file" >&2
            exit 1
          }
          # Tolerate pasted whitespace and a copied AuthKey_<id>.p8 file name.
          uuid='^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'
          APPLE_API_KEY_ID=$(printf '%s' "$APPLE_API_KEY_ID" | tr -d '[:space:]')
          APPLE_API_KEY_ID=${APPLE_API_KEY_ID#AuthKey_}
          APPLE_API_KEY_ID=${APPLE_API_KEY_ID%.p8}
          APPLE_API_ISSUER_ID=$(printf '%s' "$APPLE_API_ISSUER_ID" | tr -d '[:space:]')
          [[ "$APPLE_API_KEY_ID" =~ $uuid ]] && {
            echo "APPLE_API_KEY_ID looks like the issuer ID; use the key ID, as in AuthKey_<key ID>.p8" >&2
            exit 1
          }
          [[ "$APPLE_API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || {
            echo "APPLE_API_KEY_ID must be only the letters and digits of the key ID, as in AuthKey_<key ID>.p8" >&2
            exit 1
          }
          [[ "$APPLE_API_ISSUER_ID" =~ $uuid ]] || {
            echo "APPLE_API_ISSUER_ID must be the issuer ID shown above the Team Keys list" >&2
            echo "  it has ${#APPLE_API_ISSUER_ID} characters after removing whitespace; expected 36" >&2
            exit 1
          }

          ditto -c -k --keepParent "$work/notarize" "$work/notarize.zip"
          xcrun notarytool submit "$work/notarize.zip" \
            --key "$work/api-key.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --output-format json \
            > "$work/notarize.json" || {
            code=$?
            echo "notarytool $(xcrun notarytool --version) submit exited with $code" >&2
            report=$(find ~/Library/Logs/DiagnosticReports -name 'notarytool*' \
              -newer "$work/notarize.zip" 2>/dev/null | head -1 || true)
            if [ -n "$report" ]; then
              echo "::group::notarytool crash report" >&2
              head -150 "$report" >&2
              echo "::endgroup::" >&2
            fi
            exit 1
          }
          id=$(jq -r .id "$work/notarize.json")
          status=$(jq -r .status "$work/notarize.json")
          echo "notarization $id: $status"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$id" --key "$work/api-key.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi

          for archive in "${archives[@]}"; do
            name=$(basename "$archive" .tar.gz)
            tar -czf "$archive" -C "$work" "$name"
            (cd "$(dirname "$archive")" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          done
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vdtoolkit-x86_64-apple-darwin
          path: dist/vdtoolkit-x86_64-apple-darwin/*
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vdtoolkit-aarch64-apple-darwin
          path: dist/vdtoolkit-aarch64-apple-darwin/*
          overwrite: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vdtoolkit-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            vdtoolkit-*.tar.gz
            vdtoolkit-*.sha256
