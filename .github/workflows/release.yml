name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: svg2vd
          - os: macos-13
            target: x86_64-apple-darwin
            executable: svg2vd
          - os: macos-14
            target: aarch64-apple-darwin
            executable: svg2vd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: svg2vd.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          directory="svg2vd-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$directory"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$directory/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$directory/"
          tar -czf "$directory.tar.gz" "$directory"
          if command -v sha256sum >/dev/null; then
            sha256sum "$directory.tar.gz" > "$directory.tar.gz.sha256"
          else
            shasum -a 256 "$directory.tar.gz" > "$directory.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: svg2vd-${{ matrix.target }}
          path: |
            svg2vd-*.tar.gz
            svg2vd-*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: svg2vd-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            svg2vd-*.tar.gz
            svg2vd-*.sha256
