name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo package --locked
      - name: Require tag to match Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} does not match Cargo version $version" >&2
            exit 1
          }

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: python3 tools/check-material-symbols.py
      - run: python3 tools/check-material-symbols.py --suite twotone-100
      - run: python3 tools/check-material-symbols.py --suite outlined-all

  build:
    needs: [preflight, conformance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: svg2vd
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: svg2vd
          - os: macos-15
            target: aarch64-apple-darwin
            executable: svg2vd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: svg2vd.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          directory="svg2vd-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$directory"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$directory/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$directory/"
          tar -czf "$directory.tar.gz" "$directory"
          if command -v sha256sum >/dev/null; then
            sha256sum "$directory.tar.gz" > "$directory.tar.gz.sha256"
          else
            shasum -a 256 "$directory.tar.gz" > "$directory.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svg2vd-${{ matrix.target }}
          path: |
            svg2vd-*.tar.gz
            svg2vd-*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: svg2vd-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            svg2vd-*.tar.gz
            svg2vd-*.sha256
