name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo package --locked
      - name: Require tag to match Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} does not match Cargo version $version" >&2
            exit 1
          }

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: python3 tools/check-material-symbols.py
      - run: python3 tools/check-material-symbols.py --suite twotone-100
      - run: python3 tools/check-material-symbols.py --suite outlined-all

  build:
    needs: [preflight, conformance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: vdt
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: vdt
          - os: macos-15
            target: aarch64-apple-darwin
            executable: vdt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: vdt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Sign and notarize
        if: runner.os == 'macOS'
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_API_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "macOS signing secrets are required for tagged releases" >&2
              exit 1
            fi
            echo "::warning::macOS signing secrets are not set; leaving $BINARY unsigned"
            exit 0
          fi

          work="$RUNNER_TEMP/signing"
          keychain="$work/signing.keychain-db"
          mkdir -p "$work"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$work/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$work/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          test -n "$identity" || {
            echo "no Developer ID Application identity in MACOS_CERTIFICATE" >&2
            exit 1
          }
          codesign --force --options runtime --timestamp \
            --keychain "$keychain" --sign "$identity" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$work/api-key.p8"
          ditto -c -k --keepParent "$BINARY" "$work/notarize.zip"
          result=$(xcrun notarytool submit "$work/notarize.zip" \
            --key "$work/api-key.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --output-format json)
          id=$(printf '%s' "$result" | jq -r .id)
          status=$(printf '%s' "$result" | jq -r .status)
          echo "notarization $id: $status"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$id" --key "$work/api-key.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi
      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing"
      - name: Package
        shell: bash
        run: |
          directory="vdtoolkit-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$directory"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$directory/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$directory/"
          tar -czf "$directory.tar.gz" "$directory"
          if command -v sha256sum >/dev/null; then
            sha256sum "$directory.tar.gz" > "$directory.tar.gz.sha256"
          else
            shasum -a 256 "$directory.tar.gz" > "$directory.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vdtoolkit-${{ matrix.target }}
          path: |
            vdtoolkit-*.tar.gz
            vdtoolkit-*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vdtoolkit-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            vdtoolkit-*.tar.gz
            vdtoolkit-*.sha256
