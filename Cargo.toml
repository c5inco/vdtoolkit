[package]
name = "vdtoolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone toolkit for Android VectorDrawable assets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/c5inco/vdtoolkit"
homepage = "https://github.com/c5inco/vdtoolkit"
documentation = "https://docs.rs/vdtoolkit"
keywords = ["svg", "android", "vectordrawable", "converter", "cli"]
categories = ["command-line-utilities", "graphics"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/tests/**",
]

[[bin]]
name = "vdt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
usvg = { version = "0.48.1", default-features = false }
walkdir = "2.5"

[dev-dependencies]
resvg = { version = "0.48.1", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
