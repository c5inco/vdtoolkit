[package]
name = "svg2vd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone SVG to Android VectorDrawable toolchain"
license = "MIT OR Apache-2.0"
repository = "https://github.com/c5inco/svg2vd"
homepage = "https://github.com/c5inco/svg2vd"
documentation = "https://docs.rs/svg2vd"
keywords = ["svg", "android", "vectordrawable", "converter", "cli"]
categories = ["command-line-utilities", "graphics"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
usvg = { version = "0.48.1", default-features = false }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
