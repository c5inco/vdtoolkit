[package]
name = "vdtoolkit-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly bindings for vdtoolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/c5inco/vdtoolkit"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
vdtoolkit = { path = "../.." }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

# Rust 1.87+ emits bulk-memory and other post-MVP ops by default; tell
# wasm-pack's bundled wasm-opt to accept them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
