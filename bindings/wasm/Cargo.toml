[package]
name = "svg2vd-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly bindings for svg2vd"
license = "MIT OR Apache-2.0"
repository = "https://github.com/c5inco/svg2vd"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
svg2vd = { path = "../.." }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
