<svg xmlns="http://www.w3.org/2000/svg" width="72" height="24" viewBox="0 0 72 24">
  <!--
    One drawing of everything only the draw target can express, laid out in
    twelve 12x12 cells so that no cell can paint over another: a group whose
    opacity composites as one layer, a dashed stroke with an offset, a blend
    mode over a backdrop, a clip path that is even-odd, one that unions two
    shapes, a luminance mask that subtracts a shape, an alpha mask and a
    luminance mask that fade, a luminance mask whose content is itself half
    transparent, which masks by half rather than keeping everything, an alpha
    mask whose content is a gradient, which stays a layer rather than becoming
    a clip, a group whose mask becomes a clip and which is isolated all the
    same, so that the blend inside it does not reach the artwork behind, and a
    luminance mask whose content is masked by a luminance mask of grey, which
    masks by half twice.
  -->
  <defs>
    <clipPath id="hole">
      <path clip-rule="evenodd" d="M1 1H11V11H1Z M4 4H8V8H4Z"/>
    </clipPath>
    <clipPath id="pair">
      <rect x="1" y="1" width="5" height="5"/>
      <rect x="4" y="4" width="5" height="5"/>
    </clipPath>
    <mask id="cut">
      <rect x="1" y="1" width="10" height="10" fill="#ffffff"/>
      <circle cx="6" cy="6" r="2" fill="#000000"/>
    </mask>
    <mask id="alpha" mask-type="alpha">
      <rect x="1" y="1" width="10" height="5" fill="#ffffff"/>
      <circle cx="6" cy="3" r="1.5" fill="#000000"/>
    </mask>
    <mask id="fade">
      <rect x="1" y="1" width="10" height="10" fill="#808080"/>
    </mask>
    <mask id="partial">
      <rect x="1" y="1" width="10" height="10" fill="#ffffff" opacity="0.5"/>
    </mask>
    <linearGradient id="alpha_fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fading_alpha" mask-type="alpha">
      <rect x="1" y="1" width="10" height="10" fill="url(#alpha_fade)"/>
    </mask>
    <mask id="white">
      <rect x="1" y="1" width="10" height="10" fill="#ffffff"/>
    </mask>
    <mask id="nested_inner" mask-type="luminance">
      <rect x="1" y="1" width="10" height="10" fill="#808080"/>
    </mask>
    <mask id="nested_outer" mask-type="luminance">
      <g mask="url(#nested_inner)"><rect x="1" y="1" width="10" height="10" fill="#ffffff"/></g>
    </mask>
  </defs>
  <g opacity="0.5">
    <circle cx="4" cy="6" r="3" fill="#ff0000" fill-opacity="0.5"/>
    <circle cx="8" cy="6" r="3" fill="#ff0000" fill-opacity="0.5"/>
  </g>
  <path d="M13 6H23" fill="none" stroke="#0000ff" stroke-width="1" stroke-dasharray="2 1"
      stroke-dashoffset="1"/>
  <rect x="25" y="2" width="10" height="8" fill="#3366cc"/>
  <g style="mix-blend-mode:multiply">
    <rect x="26" y="3" width="5" height="5" fill="#ffcc00"/>
  </g>
  <g transform="translate(36 0)" clip-path="url(#hole)">
    <rect width="12" height="12" fill="#00ffff"/>
  </g>
  <g transform="translate(0 12)" clip-path="url(#pair)">
    <rect width="12" height="12" fill="#ff00ff"/>
  </g>
  <g transform="translate(12 12)" mask="url(#cut)">
    <rect width="12" height="12" fill="#ffff00"/>
  </g>
  <g transform="translate(24 12)" mask="url(#alpha)">
    <rect width="12" height="12" fill="#00ff00"/>
  </g>
  <g transform="translate(36 12)" mask="url(#fade)">
    <rect width="12" height="12" fill="#0000ff"/>
  </g>
  <g transform="translate(48 12)" mask="url(#partial)">
    <rect width="12" height="12" fill="#0000ff"/>
  </g>
  <g transform="translate(60 0)" mask="url(#fading_alpha)">
    <rect width="12" height="12" fill="#ff00ff"/>
  </g>
  <g transform="translate(48 0)">
    <rect width="12" height="12" fill="#0000ff"/>
    <g mask="url(#white)">
      <rect width="12" height="12" fill="#ffff00" style="mix-blend-mode:multiply"/>
    </g>
  </g>
  <g transform="translate(60 12)" mask="url(#nested_outer)">
    <rect width="12" height="12" fill="#ff0000"/>
  </g>
</svg>
