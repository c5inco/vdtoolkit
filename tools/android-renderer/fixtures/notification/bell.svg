<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Two flat colors and a half-opaque element: flattening must keep the
       geometry and the opacity, and lose both colors. Axis-aligned squares
       keep the device pixel assertions exact. -->
  <path d="M4 4H12V12H4Z" fill="#3DDC84"/>
  <path d="M12 12H20V20H12Z" fill="#073042" fill-opacity="0.5"/>
</svg>
